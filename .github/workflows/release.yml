name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: gate (typecheck + tests + lint)
        run: pnpm check
      - name: extraction gauntlet (35 golden expectations)
        run: pnpm exec tsx scripts/gauntlet-report.ts --strict
      - name: build all libraries
        run: pnpm -r --if-present run build
      - name: authenticate to npm
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: publish @ui-graph/* (topological, idempotent — skips already-published versions)
        run: |
          set -e
          for dir in packages/core packages/mcp packages/adapter-react packages/adapter-vue packages/adapter-angular packages/adapter-next packages/cli; do
            name=$(node -p "require('./$dir/package.json').name")
            ver=$(node -p "require('./$dir/package.json').version")
            priv=$(node -p "require('./$dir/package.json').private === true")
            if [ "$priv" = "true" ]; then continue; fi
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "= $name@$ver already published, skipping"
              continue
            fi
            echo "+ publishing $name@$ver"
            ( cd "$dir" && pnpm publish --access public --provenance --no-git-checks --registry https://registry.npmjs.org/ )
          done
